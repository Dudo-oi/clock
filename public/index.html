<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>双人打卡 · 实时同步</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --bg: #fef8fb; --card: #fff; --text: #333; --border: #f0e4ec; --primary: #ff97b7; --primary-light: #ffe8f0; --success: #52c41a; }
    .dark { --bg: #1c1c2e; --card: #2a2a40; --text: #eee; --border: #383850; --primary: #7367f0; --primary-light: #373070; }
    .t1 { --bg: #f8fbff; --primary: #69b1ff; --primary-light: #e8f3ff; --text: #1f2a44; }
    .t2 { --bg: #fbfef8; --primary: #73d13d; --primary-light: #efffde; --text: #2c3e2f; }
    .t3 { --bg: #fffaf8; --primary: #ff7a5c; --primary-light: #ffebe5; --text: #4a2c2a; }
    body { background: var(--bg); color: var(--text); padding: 12px; transition: background 0.2s, color 0.2s; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; }
    button { border: none; border-radius: 12px; padding: 8px 14px; background: var(--primary); color: white; cursor: pointer; font-size: 12px; font-weight: 500; margin: 2px; transition: 0.1s ease; touch-action: manipulation; }
    button:active { transform: scale(0.96); }
    .input-box { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; width: 150px; }
    .card { background: var(--card); border-radius: 24px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); transition: background 0.2s; }
    /* 日历卡片取消圆角 */
    .card-calendar { border-radius: 0; }
    .calendar { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
    .cal-day { aspect-ratio: 1/1; background: var(--primary-light); border-radius: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; }
    .cal-day.today { border: 2px solid var(--primary); }
    .cal-ico { font-size: 12px; margin-top: 3px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .avatar { font-size: 48px; cursor: pointer; margin: 6px 0; display: flex; justify-content: center; align-items: center; }
    .avatar img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
    .nickname { font-size: 18px; font-weight: bold; cursor: pointer; background: var(--primary-light); display: inline-block; padding: 4px 14px; border-radius: 40px; margin: 6px 0; }
    .sign-flag { cursor: pointer; font-size: 15px; margin: 6px 0; }
    .coin { color: var(--success); font-weight: bold; font-size: 15px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: var(--primary-light); border-radius: 16px; padding: 10px 12px; margin: 8px 0; }
    .task-item.done { opacity: 0.6; text-decoration: line-through; }
    .hide { display: none; }
    .mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .pop { background: var(--card); border-radius: 28px; padding: 24px; width: 90%; max-width: 380px; max-height: 70vh; overflow: auto; }
    .ico-list { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
    .ico-item { font-size: 36px; padding: 8px; border-radius: 20px; background: var(--primary-light); cursor: pointer; text-align: center; min-width: 60px; }
    .theme-option { font-size: 18px; padding: 8px 16px; min-width: 80px; }
    .chart-box { height: 210px; margin-top: 8px; }
    .flex-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .sync-status { display: none; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 40px; font-size: 14px; z-index: 2000; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
    .toast.show { opacity: 1; }
    .history-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
    .history-day { text-align: center; padding: 4px; background: var(--primary-light); border-radius: 8px; font-size: 12px; }
    /* 宽容一下列表样式 */
    .excuse-list { margin-top: 16px; max-height: 400px; overflow-y: auto; }
    .excuse-item { background: var(--primary-light); border-radius: 16px; padding: 12px; margin-bottom: 12px; cursor: pointer; }
    .excuse-item:hover { background: var(--border); }
    .excuse-date { font-weight: bold; margin-bottom: 6px; }
    .excuse-status { font-size: 12px; display: flex; justify-content: space-between; }
    .like-retract { background: none; border: none; font-size: 20px; margin-left: 8px; cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
  <div class="flex-between">
    <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
      <input class="input-box" id="roomId" placeholder="房间号" value="">
      <button id="joinRoomBtn">📡 加入房间</button>
      <button id="leaveRoomBtn" style="background:#dc3545;">🚪 退出房间</button>
      <button id="excuseBtn" style="background:#ff9800;">🙏 宽容一下</button>
    </div>
    <div>
      <button id="darkBtn">🌓 深浅</button>
      <button id="themeBtn">🎨 主题</button>
      <button id="historyBtn">📅 历史记录</button>
    </div>
  </div>
</div>

<!-- 日历卡片：取消圆角 -->
<div class="card card-calendar">
  <div id="monthTit" style="text-align:center; margin-bottom:12px; font-weight:bold;"></div>
  <div class="calendar" id="calendarBox"></div>
</div>

<div class="row2">
  <div class="card" style="text-align:center;">
    <div class="avatar" id="avt1">🐱</div>
    <div class="nickname" id="name1">小茗</div>
    <div class="sign-flag" id="sign1">⭐ 打卡标志</div>
    <div class="coin">💰 金币：<span id="c1">0</span></div>
  </div>
  <div class="card" style="text-align:center;">
    <div class="avatar" id="avt2">🐰</div>
    <div class="nickname" id="name2">阿悠</div>
    <div class="sign-flag" id="sign2">🌺 打卡标志</div>
    <div class="coin">💰 金币：<span id="c2">0</span></div>
  </div>
</div>

<div class="card">
  <div class="flex-between"><h4 id="taskTitle1">小茗 每日任务</h4><button id="addD1">+ 添加</button></div>
  <div id="listD1"></div>
</div>
<div class="card">
  <div class="flex-between"><h4 id="taskTitle2">阿悠 每日任务</h4><button id="addD2">+ 添加</button></div>
  <div id="listD2"></div>
</div>

<div class="card">
  <div class="flex-between"><h4>📅 每周任务</h4><span id="foldWeek" style="color:var(--primary); cursor:pointer;">收起</span></div>
  <div id="weekWrap">
    <div style="margin:10px 0;"><div class="flex-between"><span id="weekName1">小茗</span><button id="addW1">+ 周任务</button></div><div id="listW1"></div></div>
    <div><div class="flex-between"><span id="weekName2">阿悠</span><button id="addW2">+ 周任务</button></div><div id="listW2"></div></div>
  </div>
</div>

<div class="card"><h4>📊 近15天打卡比例</h4><div class="chart-box"><canvas id="chart15"></canvas></div></div>
<div class="card"><h4>📆 本周打卡比例</h4><div class="chart-box"><canvas id="chartWeek"></canvas></div></div>

<div class="mask" id="mask"><div class="pop" id="popBody"></div></div>
<div id="toast" class="toast"></div>

<script>
  let syncData = { 
    u1: { name: "小茗", avt: "🐱", sign: "⭐", coin: 0, daily: [], weekly: [], check: {} }, 
    u2: { name: "阿悠", avt: "🐰", sign: "🌺", coin: 0, daily: [], weekly: [], check: {} },
    excuses: {}  // excuses[date][uid] = { text, agreedBy: null(或对方uid) }
  };
  let currentRoom = "";
  let ws = null;
  let reconnectTimer = null;
  let foldWeek = false;
  let chart15, chartWeek;
  let localSetting = JSON.parse(localStorage.getItem("clockLocalSetting")) || { dark: false, theme: "" };
  const AVT = ['🐱','🐰','🐼','🐨','🦊','🐻','🐹','🦄','🌸','🌷','🌹','🍀','🌙','⭐','✨','🎀','🐧','🦋','🐙','🐳'];
  const SIGN = ['⭐','🌺','🌙','🍀','✨','💫','🌷','🎀','💖','🌸','🌈','🌟','🌿','🔥','❤️','💎'];
  const THEMES = ["", "t1", "t2", "t3"];

  function showMessage(msg) {
    let toast = document.getElementById("toast");
    toast.innerText = msg;
    toast.classList.add("show");
    setTimeout(() => { toast.classList.remove("show"); }, 2000);
  }

  function getDayStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  
  function isAllDailyDone(uid) {
    const u = uid === 1 ? syncData.u1 : syncData.u2;
    if (!u.daily.length) return false;
    return u.daily.every(task => task.done === true);
  }
  
  function getDailyRatio(uid) {
    const u = uid === 1 ? syncData.u1 : syncData.u2;
    if (!u.daily.length) return 0;
    const doneCount = u.daily.filter(task => task.done).length;
    return doneCount / u.daily.length;
  }
  
  function calcCheckIn() {
    const today = getDayStr(new Date());
    syncData.u1.check[today] = isAllDailyDone(1);
    syncData.u2.check[today] = isAllDailyDone(2);
  }
  
  function renderAll() { renderUserInfo(); renderCalendar(); renderTaskLists(); renderCoin(); updateCharts(); calcCheckIn(); }
  
  function renderUserInfo() {
    document.getElementById("name1").innerText = syncData.u1.name; document.getElementById("name2").innerText = syncData.u2.name;
    document.getElementById("taskTitle1").innerHTML = syncData.u1.name + " 📋 每日任务"; document.getElementById("taskTitle2").innerHTML = syncData.u2.name + " 📋 每日任务";
    document.getElementById("weekName1").innerText = syncData.u1.name; document.getElementById("weekName2").innerText = syncData.u2.name;
    const avt1 = document.getElementById("avt1");
    const avt2 = document.getElementById("avt2");
    if (syncData.u1.avt && (syncData.u1.avt.startsWith('http://') || syncData.u1.avt.startsWith('https://'))) {
      avt1.innerHTML = `<img src="${syncData.u1.avt}" style="width:48px; height:48px; border-radius:50%; object-fit:cover;">`;
    } else {
      avt1.innerText = syncData.u1.avt || "🐱";
    }
    if (syncData.u2.avt && (syncData.u2.avt.startsWith('http://') || syncData.u2.avt.startsWith('https://'))) {
      avt2.innerHTML = `<img src="${syncData.u2.avt}" style="width:48px; height:48px; border-radius:50%; object-fit:cover;">`;
    } else {
      avt2.innerText = syncData.u2.avt || "🐰";
    }
    document.getElementById("sign1").innerHTML = syncData.u1.sign + " 打卡标志";
    document.getElementById("sign2").innerHTML = syncData.u2.sign + " 打卡标志";
  }
  
  function renderCoin() { document.getElementById("c1").innerText = syncData.u1.coin; document.getElementById("c2").innerText = syncData.u2.coin; }
  
  function renderCalendar() {
    const now = new Date(), y = now.getFullYear(), m = now.getMonth();
    document.getElementById("monthTit").innerHTML = `${y}年${m+1}月`;
    const first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate(), todayStr = getDayStr(now);
    let html = "";
    for(let i=0;i<first;i++) html += `<div class="cal-day"></div>`;
    for(let d=1;d<=days;d++) {
      const s = `${y}-${String(m+1).padStart(2,0)}-${String(d).padStart(2,0)}`;
      const ico1 = syncData.u1.check[s] ? syncData.u1.sign : "";
      const ico2 = syncData.u2.check[s] ? syncData.u2.sign : "";
      const cls = s===todayStr ? "cal-day today" : "cal-day";
      html += `<div class="${cls}">${d}<div class="cal-ico">${ico1}${ico2}</div></div>`;
    }
    document.getElementById("calendarBox").innerHTML = html;
  }
  
  function renderTaskLists() {
    let d1="",d2="",w1="",w2="";
    syncData.u1.daily.forEach((it,i)=>{ d1 += `<div class="task-item ${it.done?'done':''}"><label><input type="checkbox" ${it.done?"checked":""} data-uid="1" data-type="daily" data-idx="${i}" class="task-check"> ${escapeHtml(it.name)}</label><button class="del-task" data-uid="1" data-type="daily" data-idx="${i}">删除</button></div>`; });
    syncData.u2.daily.forEach((it,i)=>{ d2 += `<div class="task-item ${it.done?'done':''}"><label><input type="checkbox" ${it.done?"checked":""} data-uid="2" data-type="daily" data-idx="${i}" class="task-check"> ${escapeHtml(it.name)}</label><button class="del-task" data-uid="2" data-type="daily" data-idx="${i}">删除</button></div>`; });
    syncData.u1.weekly.forEach((it,i)=>{ w1 += `<div class="task-item ${it.done?'done':''}"><label><input type="checkbox" ${it.done?"checked":""} data-uid="1" data-type="weekly" data-idx="${i}" class="task-check"> ${escapeHtml(it.name)}</label><button class="del-task" data-uid="1" data-type="weekly" data-idx="${i}">删除</button></div>`; });
    syncData.u2.weekly.forEach((it,i)=>{ w2 += `<div class="task-item ${it.done?'done':''}"><label><input type="checkbox" ${it.done?"checked":""} data-uid="2" data-type="weekly" data-idx="${i}" class="task-check"> ${escapeHtml(it.name)}</label><button class="del-task" data-uid="2" data-type="weekly" data-idx="${i}">删除</button></div>`; });
    document.getElementById("listD1").innerHTML = d1; document.getElementById("listD2").innerHTML = d2;
    document.getElementById("listW1").innerHTML = w1; document.getElementById("listW2").innerHTML = w2;
    document.querySelectorAll('.task-check').forEach(cb=>{ cb.removeEventListener('change', handleTaskCheck); cb.addEventListener('change', handleTaskCheck); });
    document.querySelectorAll('.del-task').forEach(btn=>{ btn.removeEventListener('click', handleTaskDelete); btn.addEventListener('click', handleTaskDelete); });
  }
  function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  
  function handleTaskCheck(e) {
    const cb=e.target, uid=parseInt(cb.dataset.uid), type=cb.dataset.type, idx=parseInt(cb.dataset.idx);
    const u = uid===1?syncData.u1:syncData.u2, arr = type==="daily"?u.daily:u.weekly;
    if(!arr[idx]) return;
    const oldDone = arr[idx].done;
    arr[idx].done = cb.checked;
    const add = type==="daily"?1:3;
    if(arr[idx].done && !oldDone) u.coin += add;
    else if(!arr[idx].done && oldDone) u.coin -= add;
    calcCheckIn();
    pushToBackend();
    renderAll();
  }
  function handleTaskDelete(e) {
    const btn=e.currentTarget, uid=parseInt(btn.dataset.uid), type=btn.dataset.type, idx=parseInt(btn.dataset.idx);
    const u = uid===1?syncData.u1:syncData.u2, arr = type==="daily"?u.daily:u.weekly;
    arr.splice(idx,1); calcCheckIn(); pushToBackend(); renderAll();
  }
  function addTaskGeneric(type,uid) {
    const name = prompt("📝 输入任务名称");
    if(!name || name.trim()==="") return;
    const u = uid===1?syncData.u1:syncData.u2;
    u[type].push({ name: name.trim(), done: false });
    pushToBackend(); renderAll();
  }
  
  // 图表：折线图
  function initCharts() {
    if(chart15) chart15.destroy(); if(chartWeek) chartWeek.destroy();
    const ctx15 = document.getElementById("chart15")?.getContext("2d"), ctxWeek = document.getElementById("chartWeek")?.getContext("2d");
    if(ctx15 && ctxWeek) {
      chart15 = new Chart(ctx15, { type:"line", data:{ labels:[], datasets:[{ label:syncData.u1.name, data:[], borderColor:"#ff97b7", backgroundColor:"rgba(255,151,183,0.1)", tension:0.2, fill:true }, { label:syncData.u2.name, data:[], borderColor:"#69b1ff", backgroundColor:"rgba(105,177,255,0.1)", tension:0.2, fill:true }] }, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ min:0, max:1, title:{ display:true, text:"完成比例" } } } } });
      chartWeek = new Chart(ctxWeek, { type:"line", data:{ labels:["一","二","三","四","五","六","日"], datasets:[{ label:syncData.u1.name, data:[], borderColor:"#ff97b7", backgroundColor:"rgba(255,151,183,0.1)", tension:0.2, fill:true }, { label:syncData.u2.name, data:[], borderColor:"#69b1ff", backgroundColor:"rgba(105,177,255,0.1)", tension:0.2, fill:true }] }, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ min:0, max:1, title:{ display:true, text:"完成比例" } } } } });
    }
  }
  
  function updateCharts() {
    if(!chart15||!chartWeek) { initCharts(); if(!chart15||!chartWeek) return; }
    try {
      const lab15=[], d15_1=[], d15_2=[];
      for(let i=14;i>=0;i--) { const dt=new Date(); dt.setDate(dt.getDate()-i); const s=getDayStr(dt); lab15.push(`${dt.getMonth()+1}/${dt.getDate()}`); d15_1.push(getDailyRatio(1)); d15_2.push(getDailyRatio(2)); }
      chart15.data.labels=lab15; chart15.data.datasets[0].data=d15_1; chart15.data.datasets[1].data=d15_2; chart15.data.datasets[0].label=syncData.u1.name; chart15.data.datasets[1].label=syncData.u2.name; chart15.update();
      const w1=[0,0,0,0,0,0,0], w2=[0,0,0,0,0,0,0], now=new Date(), todayIdx=now.getDay()||7;
      for(let i=0;i<7;i++) { const dt=new Date(); dt.setDate(dt.getDate()-(todayIdx-1-i)); const s=getDayStr(dt); w1[i]=getDailyRatio(1); w2[i]=getDailyRatio(2); }
      chartWeek.data.datasets[0].data=w1; chartWeek.data.datasets[1].data=w2; chartWeek.data.datasets[0].label=syncData.u1.name; chartWeek.data.datasets[1].label=syncData.u2.name; chartWeek.update();
    } catch(e) { console.warn(e); }
  }
  
  // WebSocket
  function getWebSocketUrl() { let protocol = window.location.protocol === "https:" ? "wss:" : "ws:"; return `${protocol}//${window.location.host}`; }
  function connectWebSocket(roomId) {
    if(ws) ws.close();
    const wsUrl = getWebSocketUrl();
    ws = new WebSocket(wsUrl);
    ws.onopen = () => { console.log("✅ WebSocket 已连接"); ws.send(JSON.stringify({ type: 'join', roomId })); };
    ws.onmessage = (event) => { try { const msg = JSON.parse(event.data); if (msg.type === 'sync') { syncData = msg.data; renderAll(); } else if (msg.type === 'error') { showMessage(msg.message); localStorage.removeItem("savedRoom"); currentRoom = ""; ws.close(); } } catch(e) { console.error(e); } };
    ws.onerror = (err) => { console.error("WebSocket 错误", err); showMessage("连接服务器失败"); };
    ws.onclose = () => { console.log("WebSocket 断开"); if (reconnectTimer) clearTimeout(reconnectTimer); if (currentRoom) { reconnectTimer = setTimeout(() => { connectWebSocket(currentRoom); }, 3000); } };
  }
  function pushToBackend() { if (ws && ws.readyState === WebSocket.OPEN && currentRoom) { ws.send(JSON.stringify({ type: 'update', roomId: currentRoom, payload: syncData })); } else { console.warn("WebSocket 未就绪"); } }
  function joinRoom(room) { if (!room) { showMessage("请输入房间号"); return false; } if (currentRoom === room && ws && ws.readyState === WebSocket.OPEN) return true; currentRoom = room; localStorage.setItem("savedRoom", room); connectWebSocket(currentRoom); return true; }
  function leaveRoom() { if (ws && ws.readyState === WebSocket.OPEN && currentRoom) { ws.send(JSON.stringify({ type: 'leave', roomId: currentRoom })); } if (ws) ws.close(); currentRoom = ""; localStorage.removeItem("savedRoom"); document.getElementById("roomId").value = ""; showMessage("已退出房间"); location.reload(); }
  function autoJoin() { const savedRoom = localStorage.getItem("savedRoom"); if (savedRoom) { document.getElementById("roomId").value = savedRoom; joinRoom(savedRoom); } }
  
  // 历史记录（无❌）
  function showHistory() {
    const months = [];
    const today = new Date();
    for (let i = 0; i < 3; i++) { let d = new Date(today.getFullYear(), today.getMonth() - i, 1); months.push(d); }
    let html = `<h4>📅 打卡历史（最近3个月）</h4>`;
    for (let monthDate of months) {
      const y = monthDate.getFullYear(), m = monthDate.getMonth();
      const daysInMonth = new Date(y, m+1, 0).getDate();
      let u1Count = 0, u2Count = 0;
      let calHtml = `<div style="margin-top:16px;"><strong>${y}年${m+1}月</strong><div class="history-grid">`;
      for (let d = 1; d <= daysInMonth; d++) {
        const s = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const u1Checked = syncData.u1.check[s] ? '✅' : '';
        const u2Checked = syncData.u2.check[s] ? '✅' : '';
        if (syncData.u1.check[s]) u1Count++;
        if (syncData.u2.check[s]) u2Count++;
        calHtml += `<div class="history-day">${d}<br>${u1Checked} ${u2Checked}</div>`;
      }
      calHtml += `</div><div>${syncData.u1.name} 打卡 ${u1Count}天 &nbsp; ${syncData.u2.name} 打卡 ${u2Count}天</div></div>`;
      html += calHtml;
    }
    document.getElementById("popBody").innerHTML = html + `<button onclick="closeMask()" style="margin-top:16px;">关闭</button>`;
    document.getElementById("mask").style.display = "flex";
  }
  
  // 宽容一下：显示日期列表（竖排），点击某个日期打开详情弹窗
  function showExcuseList() {
    if (!currentRoom) { showMessage("请先加入房间"); return; }
    // 收集最近的30天（可调整）
    let dates = [];
    let today = new Date();
    for (let i = 0; i < 30; i++) {
      let d = new Date();
      d.setDate(today.getDate() - i);
      dates.push(getDayStr(d));
    }
    dates.reverse(); // 从旧到新
    let html = `<h4>🙏 宽容一下 · 日期列表</h4><div class="excuse-list">`;
    for (let date of dates) {
      const excuse1 = syncData.excuses?.[date]?.[1];
      const excuse2 = syncData.excuses?.[date]?.[2];
      const status1 = excuse1?.agreedBy ? (excuse1.agreedBy === 2 ? '👍已同意' : '✏️有借口') : (excuse1?.text ? '📝未同意' : '无');
      const status2 = excuse2?.agreedBy ? (excuse2.agreedBy === 1 ? '👍已同意' : '✏️有借口') : (excuse2?.text ? '📝未同意' : '无');
      html += `<div class="excuse-item" data-date="${date}">
        <div class="excuse-date">📅 ${date}</div>
        <div class="excuse-status">${syncData.u1.name}: ${status1} &nbsp;|&nbsp; ${syncData.u2.name}: ${status2}</div>
      </div>`;
    }
    html += `</div><button onclick="closeMask()">关闭</button>`;
    document.getElementById("popBody").innerHTML = html;
    document.getElementById("mask").style.display = "flex";
    // 绑定点击事件
    document.querySelectorAll('.excuse-item').forEach(el => {
      el.onclick = () => {
        const date = el.dataset.date;
        closeMask();
        showExcuseDetail(date);
      };
    });
  }
  
  // 显示某个日期的便利贴，可编辑借口、对方点赞/撤回
  function showExcuseDetail(date) {
    let selectedUid = 1; // 当前正在编辑/查看的用户
    // 渲染弹窗内容
    function renderDetail() {
      const excuse = syncData.excuses?.[date]?.[selectedUid] || { text: '', agreedBy: null };
      const u = selectedUid === 1 ? syncData.u1 : syncData.u2;
      const otherUid = selectedUid === 1 ? 2 : 1;
      const other = otherUid === 1 ? syncData.u1 : syncData.u2;
      const isAgreed = excuse.agreedBy === otherUid;
      const allDone = isAllDailyDone(selectedUid);
      let html = `<h4>🙏 宽容一下 · ${date}</h4>
        <div class="excuse-person" style="display:flex; justify-content:space-between; margin-bottom:16px;">
          <span data-uid="1" style="cursor:pointer; padding:6px 12px; border-radius:40px; background:${selectedUid===1?'var(--primary)': 'var(--primary-light)'}">${syncData.u1.name}</span>
          <span data-uid="2" style="cursor:pointer; padding:6px 12px; border-radius:40px; background:${selectedUid===2?'var(--primary)': 'var(--primary-light)'}">${syncData.u2.name}</span>
        </div>
        <textarea id="excuseText" class="excuse-text" rows="3" placeholder="写下当天的借口...">${escapeHtml(excuse.text)}</textarea>
        <div style="display:flex; justify-content: flex-end; margin-top:8px;">
          <button id="saveExcuseBtn">💾 保存借口</button>
          ${!allDone && !isAgreed && selectedUid !== getMyUid() ? `<button id="agreeBtn" style="background:#4caf50; margin-left:8px;">👍 同意补打卡</button>` : ''}
          ${isAgreed ? `<button id="retractBtn" style="background:#f44336; margin-left:8px;">↩️ 撤回同意</button>` : ''}
          ${allDone ? `<span style="color:green; margin-left:8px;">✅ 当日任务已完成</span>` : ''}
        </div>
      `;
      document.getElementById("popBody").innerHTML = html;
      document.getElementById("mask").style.display = "flex";
      // 切换用户
      document.querySelectorAll('[data-uid]').forEach(el => {
        el.onclick = () => { selectedUid = parseInt(el.dataset.uid); renderDetail(); };
      });
      // 保存借口
      document.getElementById("saveExcuseBtn").onclick = () => {
        const newText = document.getElementById("excuseText").value.trim();
        if (!syncData.excuses) syncData.excuses = {};
        if (!syncData.excuses[date]) syncData.excuses[date] = {};
        if (!syncData.excuses[date][selectedUid]) syncData.excuses[date][selectedUid] = {};
        syncData.excuses[date][selectedUid].text = newText;
        // 如果之前有同意状态，保留同意状态（不覆盖）
        pushToBackend();
        showMessage("借口已保存");
        renderDetail();
      };
      // 同意补打卡
      const agreeBtn = document.getElementById("agreeBtn");
      if (agreeBtn) {
        agreeBtn.onclick = () => {
          // 将 selectedUid 当天的所有每日任务设为完成，增加金币
          const u = selectedUid === 1 ? syncData.u1 : syncData.u2;
          const addedCoins = u.daily.filter(t => !t.done).length; // 每个未完成任务加1金币
          u.daily.forEach(task => { if (!task.done) { task.done = true; } });
          u.coin += addedCoins;
          calcCheckIn();
          // 记录同意者
          if (!syncData.excuses) syncData.excuses = {};
          if (!syncData.excuses[date]) syncData.excuses[date] = {};
          if (!syncData.excuses[date][selectedUid]) syncData.excuses[date][selectedUid] = {};
          syncData.excuses[date][selectedUid].agreedBy = otherUid;
          pushToBackend();
          renderAll();
          showMessage(`已为${u.name}补打卡，任务全部完成`);
          renderDetail(); // 刷新弹窗
        };
      }
      // 撤回同意
      const retractBtn = document.getElementById("retractBtn");
      if (retractBtn) {
        retractBtn.onclick = () => {
          // 撤回：将该用户当天的所有每日任务设为未完成，减去之前增加的金币
          const u = selectedUid === 1 ? syncData.u1 : syncData.u2;
          const currentDone = u.daily.filter(t => t.done).length;
          u.daily.forEach(task => { if (task.done) { task.done = false; } });
          u.coin -= currentDone; // 每个已完成任务之前加了1金币，现在扣回
          calcCheckIn();
          // 清除同意标记
          if (syncData.excuses?.[date]?.[selectedUid]) {
            delete syncData.excuses[date][selectedUid].agreedBy;
          }
          pushToBackend();
          renderAll();
          showMessage(`已撤回对${u.name}的补打卡`);
          renderDetail();
        };
      }
    }
    renderDetail();
  }
  
  // 辅助获取当前用户（简单返回1或2？因为房间只有两人，我们可以在同意时判断点击者是另一个人，但为了简单，让界面上两个人都能同意/撤回，但只有对方操作才有意义。不做严格限制，由用户自觉）
  function getMyUid() {
    // 这里我们不实现自动识别，但可以让按钮显示条件仅为“不是当前选中的用户”即可，实际应用中另一方会操作。
    return null;
  }
  
  // UI 弹窗等
  function applyTheme() { document.body.className = localSetting.theme; if(localSetting.dark) document.body.classList.add("dark"); }
  function saveLocalSetting() { localStorage.setItem("clockLocalSetting", JSON.stringify(localSetting)); }
  function showIcoPop(type, uid) {
    const list = type === "avt" ? AVT : SIGN;
    const title = type === "avt" ? "选择头像（也可自定义图片）" : "选择打卡标志";
    let html = `<h4 style="margin-bottom:12px;">${title}</h4><div class="ico-list">`;
    list.forEach(ico => html += `<div class="ico-item" data-ico="${ico}">${ico}</div>`);
    if (type === "avt") { html += `<div class="ico-item" data-ico="custom">📷 自定义图片</div>`; }
    html += `</div><button onclick="closeMask()">关闭</button>`;
    document.getElementById("popBody").innerHTML = html;
    document.getElementById("mask").style.display = "flex";
    document.querySelectorAll('.ico-item').forEach(el => {
      el.onclick = () => {
        const val = el.dataset.ico;
        const u = uid === 1 ? syncData.u1 : syncData.u2;
        if (type === "avt") {
          if (val === "custom") {
            let url = prompt("请输入图片URL（网络地址）:", "https://example.com/avatar.png");
            if (url && (url.startsWith("http://") || url.startsWith("https://"))) { u.avt = url; } else { showMessage("无效的URL"); }
          } else { u.avt = val; }
        } else { u.sign = val; }
        closeMask(); pushToBackend(); renderAll();
      };
    });
  }
  function showThemePop() {
    let html = `<h4>🎨 配色主题</h4><div class="ico-list">`;
    const themeNames = ["默认", "主题一", "主题二", "主题三"];
    THEMES.forEach((t, idx) => { html += `<div class="ico-item theme-option" data-theme="${t}">${themeNames[idx]}</div>`; });
    html += `</div><button onclick="closeMask()">关闭</button>`;
    document.getElementById("popBody").innerHTML = html; document.getElementById("mask").style.display = "flex";
    document.querySelectorAll('[data-theme]').forEach(el=>{ el.onclick=()=>{ localSetting.theme=el.dataset.theme; applyTheme(); saveLocalSetting(); closeMask(); }; });
  }
  function closeMask() { document.getElementById("mask").style.display="none"; }
  function editName(uid) { const u = uid===1?syncData.u1:syncData.u2; const newName = prompt("修改昵称", u.name); if(newName && newName.trim()) u.name = newName.trim(); pushToBackend(); renderAll(); }
  
  function bindEvents() {
    document.getElementById("joinRoomBtn").onclick = () => { joinRoom(document.getElementById("roomId").value.trim()); };
    document.getElementById("leaveRoomBtn").onclick = leaveRoom;
    document.getElementById("darkBtn").onclick=()=>{ localSetting.dark=!localSetting.dark; applyTheme(); saveLocalSetting(); };
    document.getElementById("themeBtn").onclick=showThemePop;
    document.getElementById("historyBtn").onclick=showHistory;
    document.getElementById("excuseBtn").onclick=showExcuseList;
    document.getElementById("avt1").onclick=()=>showIcoPop("avt",1); document.getElementById("avt2").onclick=()=>showIcoPop("avt",2);
    document.getElementById("sign1").onclick=()=>showIcoPop("sign",1); document.getElementById("sign2").onclick=()=>showIcoPop("sign",2);
    document.getElementById("name1").onclick=()=>editName(1); document.getElementById("name2").onclick=()=>editName(2);
    document.getElementById("addD1").onclick=()=>addTaskGeneric("daily",1); document.getElementById("addD2").onclick=()=>addTaskGeneric("daily",2);
    document.getElementById("addW1").onclick=()=>addTaskGeneric("weekly",1); document.getElementById("addW2").onclick=()=>addTaskGeneric("weekly",2);
    const foldBtn=document.getElementById("foldWeek"); foldBtn.onclick=()=>{ foldWeek=!foldWeek; document.getElementById("weekWrap").classList.toggle("hide",foldWeek); foldBtn.innerText=foldWeek?"展开":"收起"; };
  }
  
  function initDefaultTasks() {
    if(syncData.u1.daily.length===0) syncData.u1.daily=[{ name:"早晨喝水", done:false },{ name:"学习30分钟", done:false }];
    if(syncData.u2.daily.length===0) syncData.u2.daily=[{ name:"散步20分钟", done:false },{ name:"整理笔记", done:false }];
    if(syncData.u1.weekly.length===0) syncData.u1.weekly=[{ name:"周末复盘", done:false }];
    if(syncData.u2.weekly.length===0) syncData.u2.weekly=[{ name:"帮助他人", done:false }];
    if(!syncData.excuses) syncData.excuses = {};
  }
  
  (function() {
    initDefaultTasks();
    applyTheme();
    bindEvents();
    initCharts();
    renderAll();
    autoJoin();
  })();
</script>
</body>
</html>
